<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f3f2f2;color:#201e1d;font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#96040e;text-decoration:none}a:hover{color:#d40511}
  ::selection{background:#ffc4c7}:focus-visible{outline:2px solid #d40511;outline-offset:2px}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}
  .bar{position:sticky;top:0;z-index:20;background:#f3f2f2;border-bottom:2px solid #201e1d}
  .bar .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.03em;color:#201e1d}.brand span{color:#d40511}
  .nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .nav a{font-size:13px;font-weight:600;letter-spacing:.02em;color:#201e1d}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-size:15px;font-weight:700;letter-spacing:.01em}
  .btn-red{background:#d40511;color:#fff}.btn-red:hover{background:#b00410;color:#fff}
  .btn-outline{border:2px solid #201e1d;color:#201e1d}.btn-outline:hover{background:#201e1d;color:#f3f2f2}
  .crumbs{font-size:12px;font-weight:600;letter-spacing:.04em;color:#605d5d;padding:22px 0 0}
  .crumbs a{color:#605d5d}.crumbs a:hover{color:#d40511}
  article{max-width:760px;padding:28px 0 72px}
  article h1{font-size:clamp(34px,4.6vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:14px 0 26px;text-wrap:balance}
  article h2{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:52px 0 14px;padding-top:22px;border-top:2px solid #201e1d}
  article h3{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:30px 0 10px}
  article p,article li{font-size:17px;line-height:1.6;color:#2b2929}
  article p{margin:0 0 18px}
  article ul,article ol{padding-left:22px;margin:0 0 18px}article li{margin:6px 0}
  article strong{font-weight:700;color:#201e1d}
  article table{width:100%;border-collapse:collapse;margin:8px 0 24px;font-size:15px;line-height:1.45}
  article th,article td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-top:2px solid #d7d3d3}
  article th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#605d5d;border-top:2px solid #201e1d}
  article em{color:#605d5d}
  article hr{border:0;border-top:2px solid #d7d3d3;margin:36px 0}
  article a.btn{margin:6px 0 10px}
  .tbl{overflow-x:auto}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:8px 0 28px;border-top:2px solid #201e1d}
  .plan{padding:32px 36px 36px 0}
  .plan+.plan{border-left:2px solid #201e1d;padding:32px 0 36px 36px;background:#eae9e9}
  .plan .name{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .plan .tag{background:#d40511;color:#fff;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .plan .price{display:flex;align-items:baseline;gap:8px;margin-top:18px}
  .plan .price b{font-size:clamp(40px,4.4vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1}
  .plan .price span{font-size:16px;font-weight:600;color:#605d5d}
  .plan .sub{margin-top:8px;font-size:13px;font-weight:600;color:#605d5d}
  .plan ul{list-style:none;padding:0;margin:28px 0 0}
  .plan li{border-top:2px solid #d7d3d3;padding:12px 0;font-size:15px;line-height:1.4;margin:0}
  .plan .btn{margin-top:28px}
  @media (max-width:700px){.plans{grid-template-columns:1fr}.plan{padding:28px 0 32px !important}.plan+.plan{border-left:0;border-top:2px solid #201e1d;background:transparent}}
  .cta{background:#d40511;color:#fff;border-top:2px solid #201e1d;border-bottom:2px solid #201e1d}
  .cta .wrap{padding:64px 32px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:end}
  .cta h2{margin:0;font-size:clamp(30px,4.2vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1}
  .cta p{margin:14px 0 0;font-size:17px;color:#ffd9db}
  .cta .links{display:flex;flex-direction:column;gap:2px;border-top:2px solid rgba(255,255,255,.5);padding-top:20px}
  .cta .links a{display:flex;justify-content:space-between;padding:18px 22px;font-size:17px;font-weight:700;background:#201e1d;color:#f3f2f2}
  .cta .links a:hover{background:#000}
  footer .wrap{padding:32px;display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;font-size:12px;font-weight:600;color:#605d5d}
  footer a{color:#605d5d}footer a:hover{color:#d40511}
  @media (max-width:900px){
    .cta .wrap{grid-template-columns:1fr;padding:48px 32px}
    .bar .wrap{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 20px}
    .nav{gap:6px 14px;width:100%;justify-content:flex-start}
    .nav .btn{margin-left:auto}
  }
  @media (max-width:600px){
    .wrap{padding:0 20px}.bar .wrap{padding:10px 20px}
    .nav a{font-size:12px}.nav .btn{width:100%;justify-content:center;margin:6px 0 0}
    article{padding:20px 0 56px}article h1{font-size:32px}article h2{font-size:22px;margin-top:40px}
    article p,article li{font-size:16px}
    .cta .wrap{padding:40px 20px}footer .wrap{padding:24px 20px}
  }
</style>
</head>
<body>
